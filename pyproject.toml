[project]
name = "halden"
version = "0.1.0"
description = "Halden Roasters analytics portfolio: synthetic data, pipelines and analysis"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.3",
    "faker==33.1.0",
    "duckdb==2.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
